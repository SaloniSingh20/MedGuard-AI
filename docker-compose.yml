version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: medguard

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/medguard
      PORT: 5000
    depends_on:
      - mongodb
    volumes:
      - ./backend/uploads:/app/uploads

  ai-service:
    build: ./ai-service
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - ai-service

volumes:
  mongodb_data: